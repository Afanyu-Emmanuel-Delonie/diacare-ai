spring.application.name=diabetes-monitoring-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/diabetes_monitoring_db}
spring.datasource.username=${DB_USERNAME:diabetes_app_user}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:diabetes-monitoring-super-secret-key-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.demo-data.enabled=${DEMO_DATA_ENABLED:true}
