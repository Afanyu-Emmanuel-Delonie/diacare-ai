spring.application.name=diabetes-monitoring-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/diabetes_monitoring_db}
spring.datasource.username=${DB_USERNAME:diabetes_app_user}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:INSECURE-DEFAULT-DO-NOT-USE-IN-PRODUCTION}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Demo/seed data must be explicitly enabled - it creates accounts with known passwords.
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# Comma-separated list of allowed frontend origins. Must be set for any non-local deployment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
